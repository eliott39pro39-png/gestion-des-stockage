name: 27.5 validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'smart_tools.py'
      - 'tests/**'
      - '.github/workflows/validate-27-5.yml'
  workflow_dispatch:
jobs:
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check for all Python files
        run: python3 -m compileall -q app.py windows versions tests
      - name: Verify safe organizer, disk map and backups
        run: PYTHONPATH=. python3 tests/test_smart_tools.py
      - name: GTK4 headless startup smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 xvfb
          xvfb-run -a env PYTHONPATH=. /usr/bin/python3 tests/test_smoke_gtk.py
