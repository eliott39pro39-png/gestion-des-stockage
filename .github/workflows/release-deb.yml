name: Build Debian package
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/linux-27.3-fluid']
    tags: ['v*']
    paths:
      - 'app.py'
      - 'mountain-bg.png'
      - 'versions/**'
      - 'packaging/**'
      - '.github/workflows/release-deb.yml'
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python sources
        run: |
          set -euo pipefail
          test -s app.py
          test -s mountain-bg.png
          python3 -m py_compile app.py
          find versions -name app.py -exec python3 -m py_compile {} +
      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep '^VERSION=' app.py | head -n 1 | cut -d "'" -f 2)"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Build Debian package
        run: bash packaging/build-deb.sh "${{ steps.version.outputs.value }}"
      - name: Verify Debian package contents
        shell: bash
        run: |
          set -euo pipefail
          deb="dist/gestion-stockage-${{ steps.version.outputs.value }}-all.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "gestion-stockage"
          test "$(dpkg-deb -f "$deb" Version)" = "${{ steps.version.outputs.value }}"
          # Regression: both metadata fields must match the expected package.
          test "$(dpkg-deb -f "$deb" Package)" = "gestion-stockage"
          test "$(dpkg-deb -f "$deb" Version)" = "${{ steps.version.outputs.value }}"
          dpkg-deb --contents "$deb" > /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/gestion-stockage/app.py' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/gestion-stockage/mountain-bg.png' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/bin/gestion-stockage' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/applications/gestion-stockage.desktop' /tmp/gestion-stockage-contents.txt
          dpkg-deb --extract "$deb" /tmp/gestion-stockage-installed
          python3 -m py_compile /tmp/gestion-stockage-installed/usr/share/gestion-stockage/app.py
      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stockage-deb-${{ steps.version.outputs.value }}
          path: dist/*.deb
          if-no-files-found: error
      - name: Publish Linux 27.5.1 official release
        if: github.ref == 'refs/heads/main' && steps.version.outputs.value == '27.5.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v27.5.1" >/dev/null 2>&1; then
            echo "Release v27.5.1 already exists; keeping published assets unchanged."
          else
            gh release create "v27.5.1" dist/gestion-stockage-27.5.1-all.deb \
              --target "${GITHUB_SHA}" --title "Gestion de stockage 27.5.1 — Linux" \
              --notes "Version Linux 27.5.1 : explorateur en colonnes, radar des doublons avec sélection manuelle, anciennes versions protégées et analyses annulables. Le paquet Debian met à niveau le paquet gestion-stockage existant. Compilation et structure du paquet validées automatiquement ; interface graphique à tester sur Ubuntu." \
              --latest
          fi
      - name: Publish release only for explicit version tags
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.deb --generate-notes --verify-tag

          dpkg-deb -f "$deb" Package Version | grep -q '^Version: '
          dpkg-deb --contents "$deb" > /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/gestion-stockage/app.py' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/gestion-stockage/mountain-bg.png' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/bin/gestion-stockage' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/applications/gestion-stockage.desktop' /tmp/gestion-stockage-contents.txt
          dpkg-deb --extract "$deb" /tmp/gestion-stockage-installed
          python3 -m py_compile /tmp/gestion-stockage-installed/usr/share/gestion-stockage/app.py
      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stockage-deb-${{ steps.version.outputs.value }}
          path: dist/*.deb
          if-no-files-found: error
      - name: Publish Linux 27.5.1 official release
        if: github.ref == 'refs/heads/main' && steps.version.outputs.value == '27.5.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v27.5.1" >/dev/null 2>&1; then
            echo "Release v27.5.1 already exists; keeping published assets unchanged."
          else
            gh release create "v27.5.1" dist/gestion-stockage-27.5.1-all.deb \
              --target "${GITHUB_SHA}" --title "Gestion de stockage 27.5.1 — Linux" \
              --notes "Version Linux 27.5.1 : explorateur en colonnes, radar des doublons avec sélection manuelle, anciennes versions protégées et analyses annulables. Le paquet Debian met à niveau le paquet gestion-stockage existant. Compilation et structure du paquet validées automatiquement ; interface graphique à tester sur Ubuntu." \
              --latest
          fi
      - name: Publish release only for explicit version tags
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.deb --generate-notes --verify-tag
