name: Build Debian package
on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/linux-27.3-fluid']
    tags: ['v*']
    paths:
      - 'app.py'
      - 'mountain-bg.png'
      - 'versions/**'
      - 'packaging/**'
      - '.github/workflows/release-deb.yml'
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python sources
        run: |
          set -euo pipefail
          test -s app.py
          test -s mountain-bg.png
          python3 -m py_compile app.py
          find versions -name app.py -exec python3 -m py_compile {} +
      - name: Determine package version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(python3 -c "import ast; t=ast.parse(open(\'app.py\',encoding=\'utf-8\').read()); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id==\'VERSION\' for x in n.targets)))")"
          fi
          [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Build Debian package
        run: bash packaging/build-deb.sh "${{ steps.version.outputs.value }}"
      - name: Verify Debian package contents
        shell: bash
        run: |
          set -euo pipefail
          deb="dist/gestion-stockage-${{ steps.version.outputs.value }}-all.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "gestion-stockage"
          test "$(dpkg-deb -f "$deb" Version)" = "${{ steps.version.outputs.value }}"
          dpkg-deb --contents "$deb" > /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/gestion-stockage/app.py' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/gestion-stockage/mountain-bg.png' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/bin/gestion-stockage' /tmp/gestion-stockage-contents.txt
          grep -q 'usr/share/applications/gestion-stockage.desktop' /tmp/gestion-stockage-contents.txt
          dpkg-deb --extract "$deb" /tmp/gestion-stockage-installed
          python3 -m py_compile /tmp/gestion-stockage-installed/usr/share/gestion-stockage/app.py
      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gestion-stockage-deb-${{ steps.version.outputs.value }}
          path: dist/*.deb
          if-no-files-found: error
      - name: Publish tested preview release on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v27.2.1" >/dev/null 2>&1; then
            echo "Release v27.2.1 already exists; not overwriting it."
          else
            gh release create "v27.2.1" dist/*.deb --target "${GITHUB_SHA}" --title "Gestion de stockage 27.2.1 (préversion)" --notes "Paquet Debian construit et vérifié automatiquement sur Ubuntu 24.04. La compilation et le contenu sont validés ; le fonctionnement de l'interface graphique doit encore être testé sur un poste Ubuntu avant de considérer cette version comme stable." --prerelease
          fi
      - name: Publish release only for explicit version tags
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.deb --generate-notes --verify-tag
