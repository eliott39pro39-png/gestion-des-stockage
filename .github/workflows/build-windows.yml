name: Build Windows preview
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'assistant_tools.py'
      - 'mountain-bg.png'
      - 'windows/**'
      - 'versions/**'
      - '.github/workflows/build-windows.yml'
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-python-send2trash
            mingw-w64-ucrt-x86_64-python-cairo
            zip
      - name: Check Windows Python syntax
        run: |
          python -m py_compile app.py assistant_tools.py windows/app_windows.py
          find versions -name app.py -exec python -m py_compile {} +
      - name: Verify storage detective and Windows update adapter
        run: |
          python - <<'PY'
          import ast
          source = ast.parse(open('app.py', encoding='utf-8').read())
          adapter = ast.parse(open('windows/app_windows.py', encoding='utf-8').read())
          assert any(isinstance(node, ast.FunctionDef) and node.name == 'storage_detective' for node in ast.walk(source))
          assert any(isinstance(node, ast.FunctionDef) and node.name == 'win_updates_page' for node in ast.walk(adapter))
          print('Storage detective and Windows updater syntax OK')
          PY
      - name: Create Windows-named legacy versions
        run: |
          mkdir -p windows/legacy
          for dir in versions/*; do
            if test -f "$dir/app.py"; then
              version="${dir##*/}"
              mkdir -p "windows/legacy/GestionStockage-Windows-$version"
              cp "$dir/app.py" "windows/legacy/GestionStockage-Windows-$version/app.py"
            fi
          done
      - name: Package Windows executable
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed \
            --name GestionStockage-Windows \
            --add-data "mountain-bg.png:." \
            --add-data "app.py:." \
            --add-data "assistant_tools.py:." \
            --add-data "versions:versions" \
            --hidden-import gi \
            --hidden-import assistant_tools \
            --collect-all gi \
            windows/app_windows.py
      - name: Archive Windows preview
        run: |
          cp -r windows/legacy dist/GestionStockage-Windows/
          cd dist
          python -m zipfile -c GestionStockage-Windows-27.5.1-preview.zip GestionStockage-Windows
      - uses: actions/upload-artifact@v4
        with:
          name: GestionStockage-Windows-27.5.1-preview
          path: dist/GestionStockage-Windows-27.5.1-preview.zip
          if-no-files-found: error

      - name: Attach Windows archive to official 27.5.1 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 45); do
            if gh release view v27.5.1 >/dev/null 2>&1; then
              gh release upload v27.5.1 dist/GestionStockage-Windows-27.5.1-preview.zip --clobber
              exit 0
            fi
            echo "Waiting for verified Linux release ($attempt/45)"
            sleep 20
          done
          echo "Linux release not yet ready; Windows archive remains in Actions artifacts."
          exit 1

