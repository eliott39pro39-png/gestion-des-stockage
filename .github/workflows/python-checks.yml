name: Python checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q app.py assistant_tools.py assistant_history.py smart_organizer.py
      - name: Assistant tests
        run: PYTHONPATH=. python tests/test_assistant_tools.py
      - name: All available unittest tests
        run: python -m unittest discover -s tests -p 'test_*.py'
