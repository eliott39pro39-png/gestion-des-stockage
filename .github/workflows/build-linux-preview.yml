name: Build Linux preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'assistant_tools.py'
      - 'assistant_history.py'
      - 'smart_organizer.py'
      - 'tests/**'
      - 'packaging/**'
      - '.github/workflows/build-linux-preview.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m compileall -q app.py assistant_tools.py assistant_history.py smart_organizer.py
      - name: Run unittest safety suite
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run regression tests
        run: PYTHONPATH=. python tests/test_assistant_tools.py
      - name: Install GTK4 smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb xauth
      - name: GTK4 application startup smoke test
        run: |
          set +e
          timeout 12s xvfb-run -a /usr/bin/python3 app.py > /tmp/gtk-startup.log 2>&1
          code=$?
          set -e
          cat /tmp/gtk-startup.log
          if [ "$code" -ne 124 ]; then
            echo "Expected running GTK app to be stopped by timeout, got $code"
            exit 1
          fi
      - name: Build Debian preview
        run: bash packaging/build-deb.sh 27.7.0
      - name: Verify package metadata and contents
        run: |
          PACKAGE=dist/gestion-stockage-27.7.0-all.deb
          test "$(dpkg-deb -f "$PACKAGE" Package)" = "gestion-stockage"
          test "$(dpkg-deb -f "$PACKAGE" Version)" = "27.7.0"
          test "$(dpkg-deb -f "$PACKAGE" Architecture)" = "all"
          dpkg-deb --contents "$PACKAGE" | grep -F 'usr/share/gestion-stockage/app.py'
          dpkg-deb --contents "$PACKAGE" | grep -F 'usr/share/gestion-stockage/assistant_tools.py'
          dpkg-deb --contents "$PACKAGE" | grep -F 'usr/bin/gestion-stockage'
          dpkg-deb --contents "$PACKAGE" | grep -F 'usr/share/applications/gestion-stockage.desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: gestion-stockage-27.7.0-linux-preview
          path: dist/gestion-stockage-27.7.0-all.deb
          if-no-files-found: error
