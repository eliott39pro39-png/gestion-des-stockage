name: Build Linux preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'assistant_tools.py'
      - 'assistant_history.py'
      - 'smart_organizer.py'
      - 'tests/**'
      - 'packaging/**'
      - '.github/workflows/build-linux-preview.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m compileall -q app.py assistant_tools.py assistant_history.py smart_organizer.py
      - name: Run regression tests
        run: PYTHONPATH=. python tests/test_assistant_tools.py
      - name: Build Debian preview
        run: bash packaging/build-deb.sh 27.7.0
      - name: Verify package metadata and contents
        run: |
          dpkg-deb --field dist/gestion-stockage-27.7.0-all.deb Package Version Architecture
          dpkg-deb --contents dist/gestion-stockage-27.7.0-all.deb | grep -F 'usr/share/gestion-stockage/app.py'
      - uses: actions/upload-artifact@v4
        with:
          name: gestion-stockage-27.7.0-linux-preview
          path: dist/gestion-stockage-27.7.0-all.deb
          if-no-files-found: error
